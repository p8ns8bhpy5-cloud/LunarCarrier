name: Build LunarCarrier

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: \${{ github.workspace }}/theos-roothide

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'
      - uses: actions/checkout@v4
      - name: Setup Environment
        run: |
          echo "\$THEOS/bin" >> "\$GITHUB_PATH"
          echo "THEOS=\$THEOS" >> "\$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive
      - name: Install SDK
        run: |
          mkdir -p "\$THEOS/sdks"
          STAGE=\$(mktemp -d)
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "\$STAGE/sdks"
          git -C "\$STAGE/sdks" sparse-checkout set iPhoneOS16.5.sdk
          cp -R "\$STAGE/sdks/iPhoneOS16.5.sdk" "\$THEOS/sdks/"
      - name: Install deps
        run: brew install ldid dpkg xz
      - name: Build
        run: sh build.sh rootless
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./packages/*.deb
